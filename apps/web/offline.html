<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#142a3b" />
    <title>PennyWise Accounting is offline</title>
    <link rel="icon" href="/icons/clearledger.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
        color: #10213b;
        background: #f7f3ed;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        place-items: center;
      }

      main {
        box-sizing: border-box;
        width: min(32rem, calc(100% - 3rem));
        padding: 2.5rem;
        border: 1px solid #d6dee6;
        border-radius: 1rem;
        background: #ffffff;
        box-shadow: 0 10px 28px rgb(16 33 59 / 8%);
        text-align: center;
      }

      img {
        width: 4.5rem;
        height: 4.5rem;
      }

      h1 {
        margin: 1.25rem 0 0.75rem;
        font-size: clamp(1.75rem, 6vw, 2.25rem);
      }

      p {
        margin: 0 auto 1.5rem;
        color: #58677c;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        padding: 0.75rem 1.2rem;
        border-radius: 0.625rem;
        background: #142a3b;
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #d98b16;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/clearledger.svg" alt="" width="72" height="72" />
      <h1>PennyWise Accounting is offline</h1>
      <p>
        Reconnect before continuing. For your protection, PennyWise Accounting does not store
        organization or financial data for offline use.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
