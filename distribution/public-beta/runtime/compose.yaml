name: clearledger-beta

services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    environment:
      POSTGRES_USER: clearledger
      POSTGRES_PASSWORD: ${CLEARLEDGER_DB_PASSWORD:?Run Start-ClearLedger.ps1 first}
      POSTGRES_DB: clearledger
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearledger -d clearledger"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - clearledger_database:/var/lib/postgresql/data
    networks:
      - internal

  migrate:
    image: ${CLEARLEDGER_IMAGE:?Run Start-ClearLedger.ps1 first}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://clearledger:${CLEARLEDGER_DB_PASSWORD}@postgres:5432/clearledger?schema=public
    command:
      - sh
      - -c
      - >-
        exec "$(readlink -f /app/node_modules/@clearledger/db)/node_modules/.bin/prisma"
        migrate deploy --schema /app/node_modules/@clearledger/db/prisma/schema.prisma
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  runtime_role:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${CLEARLEDGER_DB_PASSWORD:?Run Start-ClearLedger.ps1 first}
      CLEARLEDGER_RUNTIME_DB_PASSWORD: ${CLEARLEDGER_RUNTIME_DB_PASSWORD:?Run Start-ClearLedger.ps1 first}
    command:
      - sh
      - -ec
      - |
        psql --host postgres --username clearledger --dbname clearledger \
          --set ON_ERROR_STOP=on \
          --set runtime_password="$$CLEARLEDGER_RUNTIME_DB_PASSWORD" <<'SQL'
        SELECT 'CREATE ROLE clearledger_beta_runtime LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS'
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'clearledger_beta_runtime') \gexec
        ALTER ROLE clearledger_beta_runtime WITH LOGIN PASSWORD :'runtime_password'
          NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
        GRANT clearledger_runtime TO clearledger_beta_runtime;
        SQL
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  api:
    image: ${CLEARLEDGER_IMAGE:?Run Start-ClearLedger.ps1 first}
    restart: unless-stopped
    depends_on:
      runtime_role:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      LOG_LEVEL: info
      HOST: 0.0.0.0
      PORT: 3001
      CLEARLEDGER_BETA_RUNTIME: "true"
      DATABASE_URL: postgresql://clearledger_beta_runtime:${CLEARLEDGER_RUNTIME_DB_PASSWORD}@postgres:5432/clearledger?schema=public
      APP_BASE_URL: http://localhost:${CLEARLEDGER_LOCAL_PORT:-3000}
      API_BASE_URL: http://localhost:3001
      PAYMENT_PUBLIC_BASE_URL: http://localhost:${CLEARLEDGER_LOCAL_PORT:-3000}
      WEBHOOK_SECRET_ENCRYPTION_SECRET: ${WEBHOOK_SECRET_ENCRYPTION_SECRET:?Run Start-ClearLedger.ps1 first}
      CONNECTOR_CREDENTIAL_ENCRYPTION_SECRET: ${CONNECTOR_CREDENTIAL_ENCRYPTION_SECRET:?Run Start-ClearLedger.ps1 first}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?Run Start-ClearLedger.ps1 first}
      PAYMENT_ACCOUNT_ENCRYPTION_SECRET: ${PAYMENT_ACCOUNT_ENCRYPTION_SECRET:?Run Start-ClearLedger.ps1 first}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3001/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - clearledger_files:/app/.data
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
      - provider_egress

  web:
    image: ${CLEARLEDGER_IMAGE:?Run Start-ClearLedger.ps1 first}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command: ["node", "apps/web/serve.mjs"]
    environment:
      WEB_HOST: 0.0.0.0
      WEB_PORT: 3000
      API_BASE_URL: http://api:3001
      APP_ORIGIN: http://localhost:${CLEARLEDGER_LOCAL_PORT:-3000}
    ports:
      - "127.0.0.1:${CLEARLEDGER_LOCAL_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
      - public_ingress

networks:
  internal:
    internal: true
  # Keep the web listener reachable through Docker Desktop's host port
  # forwarding while leaving database and API traffic on the internal network.
  # This also supports older standalone docker-compose installations, which
  # cannot publish a service attached only to an internal network.
  public_ingress:
    driver: bridge
  provider_egress:

volumes:
  clearledger_database:
  clearledger_files:
