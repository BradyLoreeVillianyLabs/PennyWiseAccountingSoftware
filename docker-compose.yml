services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: clearledger
      POSTGRES_PASSWORD: clearledger_dev_only
      POSTGRES_DB: clearledger
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearledger -d clearledger"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - clearledger_postgres_data:/var/lib/postgresql/data

  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: clearledger
      POSTGRES_PASSWORD: clearledger_dev_only
      POSTGRES_DB: clearledger_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearledger -d clearledger_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clearledger_postgres_data:
